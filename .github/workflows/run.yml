name: arXiv-daily-ai-enhanced

on:
  # Bootstrap this incident's recovery when its reviewed manifest reaches main.
  push:
    branches: [main]
    paths: [recovery/2026-09-24-28.json]
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        type: choice
        options: [daily, backfill, reindex]
        default: daily
      dry_run:
        description: Validate without AI calls or publication
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: arxiv-data-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LANGUAGE: ${{ vars.LANGUAGE || 'Chinese' }}
      CATEGORIES: ${{ vars.CATEGORIES || 'cs.IT,eess.SP' }}
      MODEL_NAME: ${{ vars.MODEL_NAME || 'deepseek-chat' }}
      RESEARCH_PROFILE: ${{ vars.RESEARCH_PROFILE }}
      MODE: ${{ inputs.mode || 'daily' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4
      - name: Load complete published history and checkpoints
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data_branch
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.20"
          enable-cache: true
      - run: uv sync --frozen
      - name: Offline regression tests
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Collect, recover and validate daily bundles
        id: process
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
        run: |
          args=("$MODE" --data-root _data_branch --report-dir run-artifacts)
          if [[ "$MODE" == "backfill" || "$MODE" == "daily" ]]; then
            args+=(--manifest recovery/2026-09-24-28.json)
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          uv run --frozen python -m arxiv_daily.runner "${args[@]}"
      - name: Publish complete bundles and persist recovery checkpoints
        id: publish
        if: ${{ !cancelled() && steps.process.outcome != 'skipped' && steps.process.outcome != '' }}
        env:
          GIT_AUTHOR_NAME: ${{ vars.NAME || 'EddieYang717' }}
          GIT_AUTHOR_EMAIL: ${{ vars.EMAIL || '90122591+EddieYang717@users.noreply.github.com' }}
          GIT_COMMITTER_NAME: ${{ vars.NAME || 'EddieYang717' }}
          GIT_COMMITTER_EMAIL: ${{ vars.EMAIL || '90122591+EddieYang717@users.noreply.github.com' }}
        run: uv run --frozen python -m arxiv_daily.publish --data-root _data_branch --report run-artifacts/report.json --language "$LANGUAGE"
      - name: Save diagnostic and recovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            run-artifacts/
            _data_branch/state/
          if-no-files-found: ignore
          retention-days: 30
      - name: Final result
        if: always()
        env:
          PROCESS_RESULT: ${{ steps.process.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
        run: |
          if [[ "$PROCESS_RESULT" != "success" || "$PUBLISH_RESULT" != "success" ]]; then
            echo "抓取、校验或发布未完成；请查看报告和已保存的恢复状态。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "演练完成：未调用 AI，未发布。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "校验及数据分支提交完成。" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat run-artifacts/report.json >> "$GITHUB_STEP_SUMMARY"
